name: Compiler set

on:
  push:
    paths:
      - 'tools/cargo-lust/**'
      - '.github/workflows/compiler-set.yml'
  pull_request:
    paths:
      - 'tools/cargo-lust/**'
      - '.github/workflows/compiler-set.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compatibility:
    name: Cargo compatibility (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        run: rustup toolchain install 1.99.1 --profile minimal --component rustfmt
      - name: Format check
        run: cargo +1.99.1 fmt --manifest-path tools/cargo-lust/Cargo.toml -- --check
      - name: Compile and execute full Rust qualification
        run: cargo +1.99.1 test --manifest-path tools/cargo-lust/Cargo.toml --locked --offline

  minimum-rust:
    name: Coordinator minimum Rust
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install minimum supported Rust
        run: rustup toolchain install 1.85.0 --profile minimal
      - name: Build and test on minimum Rust
        run: cargo +1.85.0 test --manifest-path tools/cargo-lust/Cargo.toml --locked --offline

  lust:
    name: Actual Lust subset qualification
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        run: rustup toolchain install 1.99.1 --profile minimal
      - name: Build pinned tcc
        run: scripts/build-tcc.sh
      - name: Build upstream Lust
        run: cargo +1.99.1 build --profile gate --locked
      - name: Verify Lust execution and honest rejection
        env:
          LUST_TEST_LUST: ${{ github.workspace }}/target/gate/lust
        run: cargo +1.99.1 test --manifest-path tools/cargo-lust/Cargo.toml --locked --offline --test qualification actual_lust -- --ignored --nocapture

  cranelift:
    name: Cranelift runtime qualification
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned development backend
        run: rustup toolchain install nightly-2026-11-07 --profile minimal --component rustc-codegen-cranelift-preview
      - name: Verify full Rust, panic recovery, and tests
        run: cargo +nightly-2026-11-07 test --manifest-path tools/cargo-lust/Cargo.toml --locked --offline --test qualification actual_cranelift -- --ignored --nocapture
      - name: Build coordinator for measurement
        run: cargo +nightly-2026-11-07 build --manifest-path tools/cargo-lust/Cargo.toml --release --locked --offline
      - name: Measure the selected backend
        env:
          RUSTUP_TOOLCHAIN: nightly-2026-11-07
        run: python3 tools/cargo-lust/bench/measure.py --coordinator tools/cargo-lust/target/release/cargo-lust --engine cranelift --samples 6 --output compiler-set-cranelift.json
      - uses: actions/upload-artifact@v4
        with:
          name: compiler-set-cranelift
          path: compiler-set-cranelift.json
