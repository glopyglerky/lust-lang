name: Compiler set

on:
  push:
    branches: [next]
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'compiler/native/**'
      - 'crates/lustr/**'
      - 'crates/lustr-semantic/**'
      - '.github/workflows/compiler-set.yml'
  pull_request:
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'compiler/native/**'
      - 'crates/lustr/**'
      - 'crates/lustr-semantic/**'
      - '.github/workflows/compiler-set.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  semantic:
    name: Checked rustc semantic inspection
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned compiler development libraries
        run: rustup toolchain install nightly-2026-11-05 --profile minimal --component rustc-dev --component rust-src --component llvm-tools --component rustfmt
      - name: Format check
        run: cargo +nightly-2026-11-05 fmt --manifest-path crates/lustr-semantic/Cargo.toml -- --check
      - name: Build pinned inspection tool
        run: cargo +nightly-2026-11-05 build --manifest-path crates/lustr-semantic/Cargo.toml --locked --offline
      - name: Verify actual compiler semantics and artifact interoperability
        run: python3 crates/lustr-semantic/tests/test_probe.py -v

  compatibility:
    name: Cargo compatibility (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        run: rustup toolchain install 1.99.1 --profile minimal --component rustfmt
      - name: Format check
        run: cargo +1.99.1 fmt --manifest-path crates/lustr/Cargo.toml -- --check
      - name: Check paired statistical methods
        run: python3 -m unittest discover -s crates/lustr/bench -p "test_*.py" -v
      - name: Compile and execute full Rust qualification
        run: cargo +1.99.1 test --manifest-path crates/lustr/Cargo.toml --locked --offline

  minimum-rust:
    name: Coordinator minimum Rust
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install minimum supported Rust
        run: rustup toolchain install 1.85.0 --profile minimal
      - name: Build and test on minimum Rust
        run: cargo +1.85.0 test --manifest-path crates/lustr/Cargo.toml --locked --offline

  lust:
    name: Actual Lust subset qualification
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        run: rustup toolchain install 1.99.1 --profile minimal
      - name: Build pinned tcc
        run: compiler/native/scripts/build-tcc.sh
      - name: Build upstream Lust
        run: cargo +1.99.1 build --manifest-path compiler/native/Cargo.toml --profile gate --locked
      - name: Verify Lust execution and honest rejection
        env:
          LUST_TEST_LUST: ${{ github.workspace }}/compiler/native/target/gate/lust
        run: cargo +1.99.1 test --manifest-path crates/lustr/Cargo.toml --locked --offline --test qualification actual_lust -- --ignored --nocapture

  cranelift:
    name: Cranelift with unwinding qualification
    runs-on: ubuntu-24.04
    env:
      RUSTUP_TOOLCHAIN: nightly-2026-11-05
    steps:
      - uses: actions/checkout@v4
      - name: Build pinned backend with unwind support
        run: |
          bash crates/lustr/scripts/build-cranelift.sh
          source crates/lustr/target/complement/env.sh
          printf 'LUST_CRANELIFT_BACKEND=%s\n' "$LUST_CRANELIFT_BACKEND" >> "$GITHUB_ENV"
      - name: Verify full Rust, panic recovery, and tests
        run: cargo +nightly-2026-11-05 test --manifest-path crates/lustr/Cargo.toml --locked --offline --test qualification actual_cranelift -- --ignored --nocapture
      - name: Verify both Rust ABI directions across LLVM and Cranelift
        env:
          LUST_TEST_ABI_EVIDENCE: ${{ github.workspace }}/compiler-set-mixed-abi
        run: cargo +nightly-2026-11-05 test --manifest-path crates/lustr/Cargo.toml --locked --offline --test mixed_abi actual_cranelift -- --ignored --nocapture
      - name: Compile and test the coordinator with its complementary backend
        run: target/debug/cargo-lust --engine cranelift test --manifest-path crates/lustr/Cargo.toml --target-dir crates/lustr/target/complement-tests --locked --offline
      - name: Build coordinator for measurement
        run: cargo +nightly-2026-11-05 build --manifest-path crates/lustr/Cargo.toml --release --locked --offline
      - name: Measure the selected backend
        run: python3 crates/lustr/bench/measure.py --coordinator target/release/cargo-lust --engine cranelift --samples 6 --output compiler-set-cranelift.json
      - name: Build native dependency for real-project qualification
        run: compiler/native/scripts/build-tcc.sh
      - name: Compile, test, and measure unchanged Lust with both backends
        env:
          LUST_TCC_HOME: ${{ github.workspace }}/compiler/native/third_party/tcc
        run: python3 crates/lustr/bench/measure-project.py --coordinator "$GITHUB_WORKSPACE/target/release/cargo-lust" --project compiler/native --samples 2 --output compiler-set-lust-project.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compiler-set-cranelift
          path: |
            compiler-set-cranelift.json
            compiler-set-lust-project.json
            crates/lustr/target/complement/backend.json
            compiler-set-mixed-abi
