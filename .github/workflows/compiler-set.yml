name: Compiler set

on:
  push:
    branches: [next]
    paths:
      - 'tools/cargo-lust/**'
      - '.github/workflows/compiler-set.yml'
  pull_request:
    paths:
      - 'tools/cargo-lust/**'
      - '.github/workflows/compiler-set.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compatibility:
    name: Cargo compatibility (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        run: rustup toolchain install 1.99.1 --profile minimal --component rustfmt
      - name: Format check
        run: cargo +1.99.1 fmt --manifest-path tools/cargo-lust/Cargo.toml -- --check
      - name: Compile and execute full Rust qualification
        run: cargo +1.99.1 test --manifest-path tools/cargo-lust/Cargo.toml --locked --offline

  minimum-rust:
    name: Coordinator minimum Rust
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install minimum supported Rust
        run: rustup toolchain install 1.85.0 --profile minimal
      - name: Build and test on minimum Rust
        run: cargo +1.85.0 test --manifest-path tools/cargo-lust/Cargo.toml --locked --offline

  lust:
    name: Actual Lust subset qualification
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        run: rustup toolchain install 1.99.1 --profile minimal
      - name: Build pinned tcc
        run: scripts/build-tcc.sh
      - name: Build upstream Lust
        run: cargo +1.99.1 build --profile gate --locked
      - name: Verify Lust execution and honest rejection
        env:
          LUST_TEST_LUST: ${{ github.workspace }}/target/gate/lust
        run: cargo +1.99.1 test --manifest-path tools/cargo-lust/Cargo.toml --locked --offline --test qualification actual_lust -- --ignored --nocapture

  cranelift:
    name: Cranelift with unwinding qualification
    runs-on: ubuntu-24.04
    env:
      RUSTUP_TOOLCHAIN: nightly-2026-11-05
    steps:
      - uses: actions/checkout@v4
      - name: Build pinned backend with unwind support
        run: |
          bash tools/cargo-lust/scripts/build-cranelift.sh
          source tools/cargo-lust/target/complement/env.sh
          printf 'LUST_CRANELIFT_BACKEND=%s\n' "$LUST_CRANELIFT_BACKEND" >> "$GITHUB_ENV"
      - name: Verify full Rust, panic recovery, and tests
        run: cargo +nightly-2026-11-05 test --manifest-path tools/cargo-lust/Cargo.toml --locked --offline --test qualification actual_cranelift -- --ignored --nocapture
      - name: Compile and test the coordinator with its complementary backend
        run: |
          CARGO_PROFILE_DEV_CODEGEN_BACKEND="$LUST_CRANELIFT_BACKEND" \
          CARGO_PROFILE_TEST_CODEGEN_BACKEND="$LUST_CRANELIFT_BACKEND" \
          cargo +nightly-2026-11-05 test -Zcodegen-backend --manifest-path tools/cargo-lust/Cargo.toml --target-dir tools/cargo-lust/target/complement-tests --locked --offline
      - name: Build coordinator for measurement
        run: cargo +nightly-2026-11-05 build --manifest-path tools/cargo-lust/Cargo.toml --release --locked --offline
      - name: Measure the selected backend
        run: python3 tools/cargo-lust/bench/measure.py --coordinator tools/cargo-lust/target/release/cargo-lust --engine cranelift --samples 6 --output compiler-set-cranelift.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compiler-set-cranelift
          path: |
            compiler-set-cranelift.json
            tools/cargo-lust/target/complement/backend.json
