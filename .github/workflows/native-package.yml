name: Native toolchain package

on:
  push:
    branches: [next, 'build/lustr-native-package*']
    paths:
      - 'crates/lustr/fixtures/**'
      - 'crates/lustr-native/**'
      - 'compiler/native/**'
      - 'upstream/lust.pin'
      - 'tools/package-toolchain.py'
      - 'tools/build-native-cargo.py'
      - 'tools/qualify-package.py'
      - 'tools/qualify-native-cargo.py'
      - 'tools/qualify-native-library.py'
      - 'tools/test-native-library-invocations.py'
      - 'tools/test-native-protocol.py'
      - 'tools/check-native-unsafe-regressions.py'
      - 'tools/check-native-mixed-generics.py'
      - 'tools/qualify-native-speed.py'
      - 'tools/test-native-speed.py'
      - 'tools/diagnose-native-library-safe.py'
      - 'tools/native-qualification.py'
      - 'tests/native-qualification/**'
      - 'tests/native-cargo/**'
      - 'tests/native-library/**'
      - 'tests/native-library-safe/**'
      - 'tests/native-speed/**'
      - 'tests/native-mixed-generics/**'
      - 'docs/compiler-set/native-package.md'
      - 'docs/compiler-set/native-acceptance.md'
      - 'docs/compiler-set/native-contract.md'
      - '.github/workflows/native-package.yml'
  pull_request:
    paths:
      - 'crates/lustr/fixtures/**'
      - 'crates/lustr-native/**'
      - 'compiler/native/**'
      - 'upstream/lust.pin'
      - 'tools/package-toolchain.py'
      - 'tools/build-native-cargo.py'
      - 'tools/qualify-package.py'
      - 'tools/qualify-native-cargo.py'
      - 'tools/qualify-native-library.py'
      - 'tools/test-native-library-invocations.py'
      - 'tools/test-native-protocol.py'
      - 'tools/check-native-unsafe-regressions.py'
      - 'tools/check-native-mixed-generics.py'
      - 'tools/qualify-native-speed.py'
      - 'tools/test-native-speed.py'
      - 'tools/diagnose-native-library-safe.py'
      - 'tools/native-qualification.py'
      - 'tests/native-qualification/**'
      - 'tests/native-cargo/**'
      - 'tests/native-library/**'
      - 'tests/native-library-safe/**'
      - 'tests/native-speed/**'
      - 'tests/native-mixed-generics/**'
      - 'docs/compiler-set/native-package.md'
      - 'docs/compiler-set/native-acceptance.md'
      - 'docs/compiler-set/native-contract.md'
      - '.github/workflows/native-package.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A branch push and its PR share a group without skipping either event's
  # qualification gate. Include the head repository to distinguish forks.
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  linux:
    name: Native-only package (Linux x86_64)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      RUSTUP_TOOLCHAIN: 1.99.1
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Install the pinned bootstrap and external test oracle
        run: rustup toolchain install 1.99.1 --profile minimal
      - name: Install functional process and native object inspection tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y strace binutils
      - name: Verify unchanged Lust source
        run: |
          rustc --edition=2024 tools/lust-upstream-check.rs -o "$RUNNER_TEMP/lust-upstream-check"
          "$RUNNER_TEMP/lust-upstream-check"
      - name: Check compiler invocation evidence parsing
        run: python3 tools/test-native-library-invocations.py
      - name: Check strict native acceptance decisions
        run: python3 tools/test-native-speed.py
      - name: Build the native compilers and runtime
        run: |
          compiler/native/scripts/build-tcc.sh
          cargo build --manifest-path compiler/native/Cargo.toml --release --locked
          python3 tools/build-native-cargo.py \
            --repository "$GITHUB_WORKSPACE" \
            --cargo "$(rustup which cargo)" \
            --rustc "$(rustup which rustc)" \
            --tcc-root "$GITHUB_WORKSPACE/compiler/native/third_party/tcc" \
            --target-dir "$RUNNER_TEMP/lustr-native-cargo" \
            --receipt "$RUNNER_TEMP/native-cargo-build.json"
      - name: Check native artifact codec and real ELF object validation
        run: |
          rustc --edition=2024 --test crates/lustr-native/src/native_artifact.rs -o "$RUNNER_TEMP/native-artifact-tests"
          "$RUNNER_TEMP/native-artifact-tests"
      - name: Check native compiler metadata queries
        run: |
          python3 tools/test-native-protocol.py \
            --native "$RUNNER_TEMP/lustr-native-cargo/x86_64-unknown-linux-gnu/gate/lustr-native" \
            --work "$RUNNER_TEMP/native-protocol-evidence"
      - name: Check unsafe grammar and callable safety regressions
        run: |
          python3 tools/check-native-unsafe-regressions.py \
            --native "$RUNNER_TEMP/lustr-native-cargo/x86_64-unknown-linux-gnu/gate/lustr-native" \
            --oracle "$(rustup which rustc)" \
            --output "$RUNNER_TEMP/native-unsafe-regression-evidence"
      - name: Check generic helpers with native unsafe and library support
        run: |
          python3 tools/check-native-mixed-generics.py \
            --native "$RUNNER_TEMP/lustr-native-cargo/x86_64-unknown-linux-gnu/gate/lustr-native" \
            --oracle "$(rustup which rustc)" \
            --output "$RUNNER_TEMP/native-mixed-generics-evidence"
      - name: Retain native dependency sources
        run: cargo vendor --manifest-path compiler/native/Cargo.toml --locked --offline "$RUNNER_TEMP/native-vendor" > "$RUNNER_TEMP/native-vendor-config.toml"
      - name: Record bounded safe-library diagnostics
        run: |
          python3 tools/diagnose-native-library-safe.py \
            --native "$RUNNER_TEMP/lustr-native-cargo/x86_64-unknown-linux-gnu/gate/lustr-native" \
            --cargo "$(rustup which cargo)" \
            --oracle "$(rustup which rustc)" \
            --output "$RUNNER_TEMP/native-library-safe-evidence"
      - name: Assemble the relocatable package
        run: |
          python3 tools/package-toolchain.py \
            --output "$RUNNER_TEMP/lustr-native-dist/lustr-native-preview-x86_64-unknown-linux-gnu" \
            --native-bin compiler/native/target/release \
            --native-cargo-bin "$RUNNER_TEMP/lustr-native-cargo/x86_64-unknown-linux-gnu/gate/lustr-native" \
            --native-cargo-receipt "$RUNNER_TEMP/native-cargo-build.json" \
            --cargo-bin "$(rustup which cargo)" \
            --cargo-notices "$(rustc --print sysroot)/share/doc/cargo" \
            --vendor-dir "$RUNNER_TEMP/native-vendor" \
            --compatibility-origin none
      - name: Verify relocation, actual engines, and retained native path
        run: |
          python3 tools/qualify-package.py \
            --package "$RUNNER_TEMP/lustr-native-dist/lustr-native-preview-x86_64-unknown-linux-gnu" \
            --baseline-native compiler/native/target/release/lust \
            --oracle-rustc "$(rustup which rustc)" \
            --output "$RUNNER_TEMP/lustr-native-dist/package-qualification.json"
      - name: Record actual native coverage and remaining gaps
        run: |
          python3 tools/native-qualification.py \
            --lust "$RUNNER_TEMP/lustr-native-dist/lustr-native-preview-x86_64-unknown-linux-gnu/bin/lust" \
            --rustc "$(rustup which rustc)" \
            --output "$RUNNER_TEMP/lustr-native-dist/native-qualification"
      - name: Enforce native compatibility, concurrency and zero-regression speed
        run: |
          python3 tools/qualify-native-speed.py \
            --native "$RUNNER_TEMP/lustr-native-cargo/x86_64-unknown-linux-gnu/gate/lustr-native" \
            --lust "$GITHUB_WORKSPACE/compiler/native/target/release/lust" \
            --cargo "$(rustup which cargo)" \
            --rustc "$(rustup which rustc)" \
            --native-build-receipt "$RUNNER_TEMP/native-cargo-build.json" \
            --tcc-root "$GITHUB_WORKSPACE/compiler/native/third_party/tcc" \
            --output "$RUNNER_TEMP/native-speed-evidence"
      - name: Verify unchanged source after build and qualification
        if: always()
        run: '"$RUNNER_TEMP/lust-upstream-check"'
      - name: Archive the qualified preview
        run: |
          tar --sort=name --owner=0 --group=0 --numeric-owner \
            --mtime="@$(git show -s --format=%ct HEAD)" \
            -C "$RUNNER_TEMP/lustr-native-dist" -cf - lustr-native-preview-x86_64-unknown-linux-gnu \
            | gzip -n -6 > "$RUNNER_TEMP/lustr-native-dist/lustr-native-preview-x86_64-unknown-linux-gnu.tar.gz"
          cd "$RUNNER_TEMP/lustr-native-dist"
          sha256sum lustr-native-preview-x86_64-unknown-linux-gnu.tar.gz > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: lustr-native-preview-linux-x86_64-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            ${{ runner.temp }}/lustr-native-dist/lustr-native-preview-x86_64-unknown-linux-gnu.tar.gz
            ${{ runner.temp }}/lustr-native-dist/SHA256SUMS
          if-no-files-found: error
          compression-level: 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lustr-package-evidence-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            ${{ runner.temp }}/lustr-native-dist/package-qualification.json
            ${{ runner.temp }}/lustr-native-dist/package-qualification-native-library
            ${{ runner.temp }}/native-library-safe-evidence
            ${{ runner.temp }}/native-protocol-evidence
            ${{ runner.temp }}/native-unsafe-regression-evidence
            ${{ runner.temp }}/native-mixed-generics-evidence
            ${{ runner.temp }}/native-speed-evidence
            ${{ runner.temp }}/lustr-native-dist/native-qualification
            ${{ runner.temp }}/lustr-native-dist/lustr-native-preview-x86_64-unknown-linux-gnu/lustr-toolchain.json
            ${{ runner.temp }}/native-cargo-build.json
            ${{ runner.temp }}/native-cargo-build.cargo.log
          if-no-files-found: warn

